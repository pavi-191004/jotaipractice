# Posts a Microsoft Teams card when a PR targets a watched branch. Self-contained: no other repo needed.
# Repo secrets: TEAMS_WEBHOOK_FRONTEND or TEAMS_WEBHOOK_BACKEND. Repo variable: TEAMS_USER_MAP
#   {"<github-login>":{"name":"<Teams name>","email":"<Teams email>"}}
name: PR notify

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]   # edit: branches whose PRs notify Teams

permissions: {}   # this job needs no access to the repo

env:
  # ---- edit per project ----
  PROJECT: jotaipractice
  TEAMS_CHAT: FRONTEND   # FRONTEND (mobile app, admin panel) or BACKEND
  DEFAULT_MENTIONS: '["pavi-191004"]'   # GitHub logins always tagged

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Send Teams card
        env:
          WEBHOOK: ${{ secrets[format('TEAMS_WEBHOOK_{0}', env.TEAMS_CHAT)] }}
          # Passed via env, never inlined in the script: PR titles are untrusted input.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          REVIEWERS: ${{ toJSON(github.event.pull_request.requested_reviewers.*.login) }}
          USER_MAP: ${{ vars.TEAMS_USER_MAP || '{}' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          def load(name, default):
              try:
                  value = json.loads(os.environ.get(name) or "")
                  return value if isinstance(value, type(default)) else default
              except ValueError:
                  return default

          webhook = os.environ.get("WEBHOOK", "")
          if not webhook:
              print(f"::error::Secret TEAMS_WEBHOOK_{os.environ['TEAMS_CHAT']} is not set.")
              sys.exit(1)

          user_map = load("USER_MAP", {})
          reviewers = [r for r in load("REVIEWERS", []) if isinstance(r, str)]
          defaults = [d for d in load("DEFAULT_MENTIONS", []) if isinstance(d, str)]
          author = os.environ["PR_AUTHOR"]

          entities, seen = [], set()

          def tag(login):
              info = user_map.get(login)
              if isinstance(info, dict) and info.get("name") and info.get("email"):
                  text = f"<at>{info['name']}</at>"
                  if login not in seen:
                      seen.add(login)
                      entities.append({
                          "type": "mention",
                          "text": text,
                          "mentioned": {"id": info["email"], "name": info["name"]},
                      })
                  return text
              return f"@{login}"

          # Keep untrusted text from faking a Teams mention.
          title = os.environ["PR_TITLE"].replace("<at>", "").replace("</at>", "")

          facts = [
              {"title": "Author", "value": tag(author)},
              {"title": "Branch", "value": f"{os.environ['PR_HEAD']} → {os.environ['PR_BASE']}"},
              {"title": "Reviewers", "value": ", ".join(tag(r) for r in reviewers) or "None requested"},
          ]

          body = [
              {"type": "TextBlock", "text": f"New pull request in {os.environ['PROJECT']}",
               "weight": "Bolder", "size": "Medium", "wrap": True},
              {"type": "TextBlock", "text": f"#{os.environ['PR_NUM']} {title}", "wrap": True},
              {"type": "FactSet", "facts": facts},
          ]

          fyi = [tag(d) for d in defaults if d != author]
          if fyi:
              body.append({"type": "TextBlock", "text": "FYI: " + ", ".join(fyi), "wrap": True})

          card = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": body,
              "actions": [{"type": "Action.OpenUrl", "title": "Open PR", "url": os.environ["PR_URL"]}],
              "msteams": {"width": "Full", "entities": entities},
          }

          payload = {
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": card,
              }],
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Teams responded {resp.status}")
          except urllib.error.HTTPError as e:
              print(f"::error::Teams webhook returned {e.code}: {e.read().decode(errors='replace')[:500]}")
              sys.exit(1)
          except urllib.error.URLError as e:
              print(f"::error::Could not reach Teams webhook: {e.reason}")
              sys.exit(1)
          PY
